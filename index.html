<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreams Playstation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0a0a1a;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255, 0, 128, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.15) 0%, transparent 40%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px);
            color: #ffffff;
            padding: 20px;
        }

        .card {
            background: linear-gradient(145deg, #14142b, #1e1e3f);
            padding: 2rem 1.5rem;
            border-radius: 16px;
            border: 3px solid #ff2e88;
            box-shadow:
                0 0 0 3px #0a0a1a,
                0 0 20px rgba(255, 46, 136, 0.6),
                0 0 40px rgba(0, 200, 255, 0.3),
                inset 0 0 20px rgba(0, 0, 0, 0.8);
            text-align: center;
            max-width: 480px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00e0ff, #ff2e88, transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .shop-name {
            font-size: 0.9rem;
            color: #ff2e88;
            text-shadow: 0 0 8px #ff2e88, 0 0 16px #ff2e88;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            animation: flicker 2s infinite alternate;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.4; }
            94% { opacity: 1; }
            96% { opacity: 0.6; }
            97% { opacity: 1; }
        }

        .shop-sub {
            font-size: 0.55rem;
            color: #00e0ff;
            text-shadow: 0 0 6px #00e0ff;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .status {
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 1rem;
            line-height: 1.8;
        }

        .info {
            color: #00e0ff;
            text-shadow: 0 0 8px rgba(0, 224, 255, 0.8);
        }

        .error {
            color: #ff4d4d;
            text-shadow: 0 0 8px rgba(255, 77, 77, 0.8);
        }

        .ua-box {
            margin-top: 1.5rem;
            font-size: 0.5rem;
            line-height: 1.8;
            color: #9aa0c0;
            word-break: break-all;
            background: #08081a;
            padding: 12px;
            border-radius: 8px;
            border: 2px dashed #2e2e5e;
            text-align: left;
        }

        .ua-box strong {
            color: #ff2e88;
        }

        .contact {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px dashed #2e2e5e;
            font-size: 0.55rem;
            color: #ffe600;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.7);
            line-height: 2;
        }

        .contact .wa {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 8px 14px;
            background: linear-gradient(145deg, #00b34a, #008f3a);
            border: 2px solid #00ff6a;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.55rem;
            box-shadow: 0 0 12px rgba(0, 255, 106, 0.6);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .contact .wa:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 106, 0.9);
        }

        .coin {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 35% 35%, #fff6a0, #ffcc00 60%, #b8860b);
            border-radius: 50%;
            border: 2px solid #ffea00;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.9);
            vertical-align: middle;
            margin: 0 4px;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .marquee {
            font-size: 0.5rem;
            color: #00ff6a;
            text-shadow: 0 0 6px #00ff6a;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="shop-name">🎮 DREAMS PLAYSTATION 🎮</div>
        <div class="shop-sub">▸ GAME STATION ◂</div>
        <div class="marquee">★ INSERT COIN ★ PLAY NOW ★</div>

        <div id="result" class="status info">Cek firmware...</div>
        <div id="user-agent" class="ua-box"></div>

        <div class="contact">
            <div><span class="coin"></span> HUBUNGI KAMI <span class="coin"></span></div>
            <div>📞 089668984861</div>
            <a class="wa" href="https://wa.me/6289668984861" target="_blank">💬 CHAT WHATSAPP</a>
        </div>
    </div>

    <script>
        function processDevice() {
            const userAgent = navigator.userAgent;
            const resultElement = document.getElementById('result');
            const uaElement = document.getElementById('user-agent');

            uaElement.innerHTML = "<strong>User-Agent Terdeteksi:</strong><br>" + userAgent;

            const isPS4 = /PlayStation 4|PS4/i.test(userAgent);

            if (isPS4) {
                const fwMatch = userAgent.match(/(?:PlayStation 4|PS4)[\s\/]+([\d\.]+)/i);

                if (fwMatch && fwMatch[1]) {
                    const firmware = parseFloat(fwMatch[1]);
                    resultElement.innerText = `Terdeteksi PS4 (FW ${firmware.toFixed(2)})`;

                    if (firmware >= 5.00 && firmware <= 9.60) {
                        resultElement.innerText += "";
                        setTimeout(() => {
                            window.location.href = "505_960/index.html";
                        }, 1000);
                    }
                    else if (firmware >= 10.00 && firmware <= 11.02) {
                        resultElement.innerText += "";
                        setTimeout(() => {
                            window.location.href = "1000_1102/index.html";
                        }, 1000);
                    }
                    else if (firmware >= 11.50 && firmware <= 13.00) {
                        resultElement.innerText += "";
                        setTimeout(() => {
                            window.location.href = "1150-1300/index.html";
                        }, 1000);
                    }
                    else if (firmware >= 13.02 && firmware <= 13.52) {
                        resultElement.innerText += "";
                        setTimeout(() => {
                            window.location.href = "1302_1352/index.html";
                        }, 1000);
                    }
                    else {
                        resultElement.className = "status error";
                        resultElement.innerText = `PS4 FW ${firmware.toFixed(2)} belum support.`;
                    }
                } else {
                    resultElement.className = "status error";
                    resultElement.innerText = "Terdeteksi PS4, tetapi gagal membaca versi Firmware secara spesifik.";
                }
            } else {
                resultElement.className = "status error";
                resultElement.innerText = "❌ Perangkat ini bukan PlayStation 4.";
            }
        }

        window.onload = processDevice;
    </script>

</body>
</html>
